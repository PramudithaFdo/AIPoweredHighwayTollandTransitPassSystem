# ============================================================================
#  Docker Compose — AI-Powered Highway Toll & Transit Pass System
#  IT6070 – Emerging Topics in Information Technology
#  Services: app (Streamlit), nginx (reverse proxy)
# ============================================================================

services:

  # ── Main Streamlit Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: toll-transit-pass-system:latest
    container_name: toll_app
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/toll_system.db
      - EASYOCR_MODULE_PATH=/app/.easyocr
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Persistent SQLite database
      - toll_data:/app/data
      # EasyOCR model cache — avoids re-downloading on container restart
      - easyocr_cache:/app/.easyocr
      # Bind-mount test images so they can be updated without rebuild
      - ./test_images:/app/test_images:ro
      # Application logs
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    networks:
      - toll_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx Reverse Proxy (production-grade routing) ─────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: toll_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - toll_net

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  toll_data:
    driver: local
  easyocr_cache:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  toll_net:
    driver: bridge
